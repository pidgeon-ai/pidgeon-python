[project]
name = "pidgeon"
version = "2.6.0"
description = "Pidgeon's Python SDK: Passport, Bouncer, Email and Auth. Sign your agents' requests, verify agents at your site, send from agent inboxes, and Sign in with Pidgeon."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pidgeon" }]
keywords = ["ai-agents", "web-bot-auth", "http-message-signatures", "rfc9421", "ed25519"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=42", "httpx>=0.27"]

[project.urls]
Homepage = "https://pidgeon.ai"
Repository = "https://github.com/pidgeon-ai/pidgeon-python"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pidgeon"]

# In the pidgeon-python mirror this directory is the root, beside langchain/
# and llamaindex/: name what the sdist takes, or it takes them too.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
