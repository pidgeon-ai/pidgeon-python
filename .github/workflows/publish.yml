name: Publish

# Tag-driven: `python-v1.3.0` publishes `pidgeon` to PyPI from the root,
# `langchain-v0.1.0` publishes `langchain-pidgeon` from `langchain/`, and
# `llamaindex-v0.1.0` publishes `llama-index-tools-pidgeon` from
# `llamaindex/`. The
# release job in the private repository (`scripts/release.ts`) cuts the tags,
# after the sync that put this tree here succeeded. Each PyPI project has its
# own trusted publisher, and each names this workflow and environment.
#
# Here rather than in the private repository so the upload carries PEP 740
# attestations — `gh-action-pypi-publish` generates them from the workflow's
# OIDC identity, and a statement about a commit nobody can read is worth
# nothing. The generator stays private; the generated client does not need
# to be.
on:
  push:
    tags: ['python-v*', 'langchain-v*', 'llamaindex-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Which project to publish
        type: choice
        options: [python, langchain, llamaindex]
        default: python

permissions:
  contents: read
  # PyPI trusted publishing exchanges this for a credential that lives for
  # one job, so no PyPI token exists in this repository's secrets.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment a PyPI trusted publisher can be pinned to. Naming it
    # here means the publisher can require it, which stops any other
    # workflow in this repository from uploading.
    environment: pypi

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7

      - name: Which project
        id: project
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          key="${PACKAGE:-${GITHUB_REF_NAME%%-v*}}"
          case "$key" in
            python) dir=. ;;
            langchain) dir=langchain ;;
            llamaindex) dir=llamaindex ;;
            *) echo "No project for $key." >&2; exit 1 ;;
          esac
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: The tag matches the version
        if: github.event_name == 'push'
        env:
          KEY: ${{ steps.project.outputs.key }}
          DIR: ${{ steps.project.outputs.dir }}
        run: |
          declared=$(grep -m1 '^version = ' "$DIR/pyproject.toml" | cut -d'"' -f2)
          tagged="${GITHUB_REF_NAME#"$KEY"-v}"

          if [ "$declared" != "$tagged" ]; then
            echo "Tag says $tagged; $DIR/pyproject.toml says $declared." >&2
            exit 1
          fi

      - name: Build
        run: uv build --directory "${{ steps.project.outputs.dir }}" --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Attestations are the default and are stated anyway: they are the
          # reason this workflow is in a public repository.
          attestations: true
          # A version PyPI already has is skipped, so a rerun of a
          # half-finished release, or a tag on a version published by hand,
          # succeeds rather than failing on the upload.
          skip-existing: true
